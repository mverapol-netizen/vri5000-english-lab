<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2b3a34" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <title>VRI5000 English Lab</title>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">VRI5000 · PERSONAL ENGLISH LAB</div>
      <h1 id="pageTitle">Today</h1>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙</button>
  </header>

  <main id="app" class="app"></main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button data-route="today" class="active"><span>◉</span><small>Today</small></button>
    <button data-route="learn"><span>▤</span><small>Learn</small></button>
    <button data-route="practice"><span>✎</span><small>Practice</small></button>
    <button data-route="course"><span>▦</span><small>Course</small></button>
    <button data-route="progress"><span>◔</span><small>Progress</small></button>
  </nav>

  <dialog id="settingsDialog">
    <form method="dialog" class="dialog-card">
      <div class="row between"><h2>Settings</h2><button class="icon-btn" value="cancel">×</button></div>
      <label>Sección del curso
        <select id="sectionSelect">
          <option value="conservative">Conservative / earliest dates</option>
          <option value="mon_wed">Mon–Wed</option>
          <option value="tue_thu">Tue–Thu</option>
          <option value="wed_fri_am">Wed–Fri AM</option>
          <option value="wed_fri_pm">Wed–Fri PM</option>
        </select>
      </label>
      <label>Duración predeterminada
        <select id="durationSelect"><option>5</option><option>10</option><option selected>20</option><option>30</option><option>45</option></select>
      </label>
      <button class="primary" id="saveSettings" value="default">Guardar</button>
      <button class="ghost" type="button" id="exportProgress">Export progress backup</button>
      <button class="ghost" type="button" id="importProgress">Import progress backup</button>
      <input id="importProgressFile" type="file" accept="application/json" hidden>
      <button class="ghost danger" type="button" id="resetProgress">Borrar progreso local</button>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
