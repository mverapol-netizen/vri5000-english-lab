name: Validate content
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check js/app.js
          node --check js/engine.js
          node --check js/store.js
          node --check js/content.js
      - name: Validate pedagogical content
        run: node scripts/validate_content.mjs
      - name: Test learning engine
        run: node scripts/test_engine.mjs
